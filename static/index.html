<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookVault — Modern Book Catalog</title>
  <meta name="description" content="A modern, high-performance book catalog application built with FastAPI and JSON file storage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="container">
    <!-- App Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">📚</div>
        <div>
          <h1 class="brand-title">BookVault</h1>
          <p class="brand-subtitle">Personal Book Catalog & Reading Tracker</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="add-book-btn" class="btn btn-primary">
          <span>+</span> Add New Book
        </button>
      </div>
    </header>

    <!-- Stats Dashboard -->
    <div id="stats-grid" class="stats-grid">
      <!-- Dynamically filled by app.js -->
    </div>

    <!-- Toolbar Controls -->
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="input-field" placeholder="Search by title, author, or keyword...">
      </div>

      <div class="filter-group">
        <select id="genre-filter" class="select-field">
          <option value="">All Genres</option>
        </select>

        <select id="status-filter" class="select-field">
          <option value="">All Statuses</option>
          <option value="Available">Available</option>
          <option value="Reading">Reading</option>
          <option value="Completed">Completed</option>
          <option value="Wishlist">Wishlist</option>
        </select>

        <select id="sort-select" class="select-field">
          <option value="title">Sort by Title</option>
          <option value="author">Sort by Author</option>
          <option value="rating">Sort by Rating</option>
          <option value="year">Sort by Year</option>
        </select>

        <div class="view-toggle">
          <button id="view-grid-btn" class="toggle-btn active" title="Grid View">⊞ Grid</button>
          <button id="view-list-btn" class="toggle-btn" title="List View">☰ List</button>
        </div>
      </div>
    </div>

    <!-- Main Books Catalog Container -->
    <main id="books-container" class="books-container grid-view">
      <!-- Dynamically populated by app.js -->
    </main>
  </div>

  <!-- Add/Edit Book Modal -->
  <div id="book-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Add New Book</h3>
        <button id="close-modal-btn" class="modal-close">&times;</button>
      </div>
      <form id="book-form">
        <div class="modal-body">
          <input type="hidden" id="form-id">
          
          <div class="form-grid">
            <div class="form-group full-width">
              <label class="form-label" for="form-title">Book Title *</label>
              <input type="text" id="form-title" class="form-input" placeholder="e.g. Clean Code" required>
            </div>

            <div class="form-group full-width">
              <label class="form-label" for="form-author">Author *</label>
              <input type="text" id="form-author" class="form-input" placeholder="e.g. Robert C. Martin" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="form-genre">Genre</label>
              <input type="text" id="form-genre" class="form-input" placeholder="e.g. Technology, Sci-Fi">
            </div>

            <div class="form-group">
              <label class="form-label" for="form-status">Status</label>
              <select id="form-status" class="form-select">
                <option value="Available">Available</option>
                <option value="Reading">Reading</option>
                <option value="Completed">Completed</option>
                <option value="Wishlist">Wishlist</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="form-year">Publication Year</label>
              <input type="number" id="form-year" class="form-input" placeholder="e.g. 2023" min="1000" max="2100">
            </div>

            <div class="form-group">
              <label class="form-label" for="form-pages">Page Count</label>
              <input type="number" id="form-pages" class="form-input" placeholder="e.g. 350" min="1">
            </div>

            <div class="form-group">
              <label class="form-label" for="form-rating">Rating (1.0 - 5.0)</label>
              <input type="number" id="form-rating" class="form-input" placeholder="4.5" min="1" max="5" step="0.1">
            </div>

            <div class="form-group">
              <label class="form-label" for="form-isbn">ISBN Number</label>
              <input type="text" id="form-isbn" class="form-input" placeholder="e.g. 978-0132350884">
            </div>

            <div class="form-group full-width">
              <label class="form-label" for="form-cover">Cover Image URL</label>
              <input type="url" id="form-cover" class="form-input" placeholder="https://example.com/cover.jpg">
            </div>

            <div class="form-group full-width">
              <label class="form-label" for="form-description">Description / Synopsis</label>
              <textarea id="form-description" class="form-textarea" placeholder="Brief summary or thoughts about the book..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancel-form-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Book</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal-overlay">
    <div class="modal-container" style="max-width: 420px;">
      <div class="modal-header">
        <h3 class="modal-title">Delete Book</h3>
        <button id="close-delete-modal-btn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-secondary);">Are you sure you want to delete this book from your catalog? This operation cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancel-delete-btn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirm-delete-btn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Book Detail Modal -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-container" style="max-width: 620px;">
      <div class="modal-header">
        <h3 class="modal-title">Book Details</h3>
        <button id="close-detail-modal-btn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="detail-content">
        <!-- Dynamically rendered -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
